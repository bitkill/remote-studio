<?xml version="1.0" encoding="UTF-8"?>
<!--
  Remote Studio brand icon.
  Square 256×256 viewBox. Designed for home-assistant/brands submission.
  Two squares: rendered in light and dark contexts via the gradient body.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 256 256"
     width="256" height="256">
  <defs>
    <linearGradient id="rs-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#5b8def"/>
      <stop offset="100%" stop-color="#2d5fc7"/>
    </linearGradient>
    <linearGradient id="rs-btn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e9eff7"/>
    </linearGradient>
  </defs>

  <!-- Square body with rounded corners; matches the brand-icon convention. -->
  <rect x="0" y="0" width="256" height="256" rx="56" ry="56" fill="url(#rs-grad)"/>

  <!-- Stylised remote silhouette: pill body with four buttons. -->
  <g transform="translate(78,42)">
    <!-- Pill body -->
    <rect x="0" y="0" width="100" height="172" rx="50" ry="50"
          fill="#ffffff" fill-opacity="0.94"/>

    <!-- ON (top, full width) -->
    <rect x="14" y="14" width="72" height="48" rx="22" ry="22" fill="url(#rs-btn)"
          stroke="#cdd5e0" stroke-width="1"/>
    <circle cx="50" cy="38" r="9" fill="none" stroke="#2d5fc7" stroke-width="3"/>
    <line x1="50" y1="29" x2="50" y2="40" stroke="#2d5fc7" stroke-width="3"
          stroke-linecap="round"/>

    <!-- Left arrow -->
    <rect x="14" y="68" width="34" height="36" rx="10" ry="10" fill="url(#rs-btn)"
          stroke="#cdd5e0" stroke-width="1"/>
    <polyline points="36,80 26,86 36,92" fill="none" stroke="#2d5fc7"
              stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Right arrow -->
    <rect x="52" y="68" width="34" height="36" rx="10" ry="10" fill="url(#rs-btn)"
          stroke="#cdd5e0" stroke-width="1"/>
    <polyline points="64,80 74,86 64,92" fill="none" stroke="#2d5fc7"
              stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- OFF (bottom, full width) -->
    <rect x="14" y="110" width="72" height="48" rx="22" ry="22" fill="url(#rs-btn)"
          stroke="#cdd5e0" stroke-width="1"/>
    <circle cx="50" cy="134" r="9" fill="none" stroke="#2d5fc7" stroke-width="3"/>
  </g>
</svg>
