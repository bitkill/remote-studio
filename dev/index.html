<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Remote Studio — local dev</title>
    <style>
      /*
       * Mirror Home Assistant's default light/dark theme so the panel
       * looks the same locally as it does inside HA. CSS custom
       * properties cross shadow-DOM boundaries by default, so anything
       * declared on :root here is reachable from inside our panel's
       * shadow root.
       */
      :root {
        color-scheme: light dark;
        --primary-color: #03a9f4;
        --accent-color: #ff9800;
        --primary-text-color: #212121;
        --secondary-text-color: #727272;
        --disabled-text-color: #bdbdbd;
        --text-primary-color: #ffffff;
        --divider-color: rgba(0, 0, 0, 0.12);
        --card-background-color: #ffffff;
        --primary-background-color: #fafafa;
        --secondary-background-color: #e5e5e5;
        --paper-card-background-color: var(--card-background-color);
        --warning-color: #ffa600;
        --error-color: #db4437;
        --success-color: #4caf50;
        --primary-color-light: #d1e9ff;
        --paper-font-body1_-_font-family: var(
          --paper-font-common-base_-_font-family,
          Roboto, Noto, sans-serif
        );
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --primary-text-color: #e1e1e1;
          --secondary-text-color: #9b9b9b;
          --disabled-text-color: #6f6f6f;
          --divider-color: rgba(225, 225, 225, 0.12);
          --card-background-color: #1c1c1c;
          --primary-background-color: #111111;
          --secondary-background-color: #202020;
          --primary-color-light: #1d3a52;
        }
      }

      html, body { margin: 0; height: 100%; }
      body {
        font-family: var(--paper-font-body1_-_font-family);
        background: var(--primary-background-color);
        color: var(--primary-text-color);
      }
      .dev-banner {
        position: fixed; top: 0; right: 0;
        background: rgba(0, 0, 0, 0.5);
        color: white;
        padding: 4px 12px;
        font-size: 11px;
        border-bottom-left-radius: 6px;
        font-family: ui-monospace, monospace;
        z-index: 1000;
      }
      .dev-status { display: block; opacity: 0.8; }
    </style>
  </head>
  <body>
    <div class="dev-banner">
      <span class="dev-status" id="status">connecting…</span>
    </div>
    <script type="module" src="./shim.mjs"></script>
  </body>
</html>
