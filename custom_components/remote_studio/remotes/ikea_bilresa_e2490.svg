<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 260 380"
     role="img"
     aria-label="IKEA BILRESA scroll wheel remote">
  <style>
    .rs-body { fill: var(--rs-body-fill, #ffffff); stroke: var(--rs-body-stroke, #d8d4cd); stroke-width: 2; }
    .rs-wheel-inner { fill: var(--rs-btn-fill, #f3efe7); stroke: var(--rs-body-stroke, #c8c2b6); stroke-width: 2; }
    .rs-button { cursor: pointer; transition: filter 120ms ease-in-out; }
    .rs-button rect, .rs-button circle, .rs-button path.btn-shape {
      fill: var(--rs-btn-fill, #faf8f4);
      stroke: var(--rs-btn-stroke, #c8c2b6);
      stroke-width: 1.5;
    }
    .rs-button:hover { filter: brightness(0.95); }
    .rs-button.is-active rect,
    .rs-button.is-active circle,
    .rs-button.is-active path.btn-shape {
      fill: var(--rs-btn-active-fill, #d8e8ff);
      stroke: var(--rs-btn-active-stroke, #5b8def);
    }
    .rs-label { fill: var(--rs-label-fill, #38322a); font-family: system-ui, sans-serif; font-weight: 600; pointer-events: none; }
    .rs-wheel-tick { fill: none; stroke: var(--rs-body-stroke, #c8c2b6); stroke-width: 2; pointer-events: none; }
    .rs-section-label { fill: var(--rs-label-fill, #38322a); opacity: 0.6; font-family: system-ui, sans-serif; font-size: 11px; font-weight: 500; pointer-events: none; }
  </style>

  <!-- Body -->
  <rect class="rs-body" x="20" y="20" width="220" height="340" rx="40" ry="40" />

  <!-- Scroll wheel illustration (top half) — non-interactive, just a visual cue. -->
  <g transform="translate(130,100)">
    <circle class="rs-wheel-inner" cx="0" cy="0" r="54" />
    <circle class="rs-wheel-inner" cx="0" cy="0" r="22" />
    <!-- Tick marks around the wheel to suggest rotation -->
    <line class="rs-wheel-tick" x1="0" y1="-50" x2="0" y2="-40" />
    <line class="rs-wheel-tick" x1="35" y1="-35" x2="28" y2="-28" />
    <line class="rs-wheel-tick" x1="50" y1="0" x2="40" y2="0" />
    <line class="rs-wheel-tick" x1="35" y1="35" x2="28" y2="28" />
    <line class="rs-wheel-tick" x1="0" y1="50" x2="0" y2="40" />
    <line class="rs-wheel-tick" x1="-35" y1="35" x2="-28" y2="28" />
    <line class="rs-wheel-tick" x1="-50" y1="0" x2="-40" y2="0" />
    <line class="rs-wheel-tick" x1="-35" y1="-35" x2="-28" y2="-28" />
  </g>
  <text class="rs-section-label" x="130" y="180" text-anchor="middle">SCROLL WHEEL</text>

  <!-- 3x3 grid of channel hotspots (bottom half) -->
  <text class="rs-section-label" x="130" y="208" text-anchor="middle">CHANNELS</text>

  <!-- Row 1 -->
  <g id="button-ch1" class="rs-button">
    <rect x="40" y="220" width="56" height="38" rx="8" ry="8" />
    <text class="rs-label" x="68" y="245" text-anchor="middle" font-size="14">1</text>
  </g>
  <g id="button-ch2" class="rs-button">
    <rect x="102" y="220" width="56" height="38" rx="8" ry="8" />
    <text class="rs-label" x="130" y="245" text-anchor="middle" font-size="14">2</text>
  </g>
  <g id="button-ch3" class="rs-button">
    <rect x="164" y="220" width="56" height="38" rx="8" ry="8" />
    <text class="rs-label" x="192" y="245" text-anchor="middle" font-size="14">3</text>
  </g>

  <!-- Row 2 -->
  <g id="button-ch4" class="rs-button">
    <rect x="40" y="266" width="56" height="38" rx="8" ry="8" />
    <text class="rs-label" x="68" y="291" text-anchor="middle" font-size="14">4</text>
  </g>
  <g id="button-ch5" class="rs-button">
    <rect x="102" y="266" width="56" height="38" rx="8" ry="8" />
    <text class="rs-label" x="130" y="291" text-anchor="middle" font-size="14">5</text>
  </g>
  <g id="button-ch6" class="rs-button">
    <rect x="164" y="266" width="56" height="38" rx="8" ry="8" />
    <text class="rs-label" x="192" y="291" text-anchor="middle" font-size="14">6</text>
  </g>

  <!-- Row 3 -->
  <g id="button-ch7" class="rs-button">
    <rect x="40" y="312" width="56" height="38" rx="8" ry="8" />
    <text class="rs-label" x="68" y="337" text-anchor="middle" font-size="14">7</text>
  </g>
  <g id="button-ch8" class="rs-button">
    <rect x="102" y="312" width="56" height="38" rx="8" ry="8" />
    <text class="rs-label" x="130" y="337" text-anchor="middle" font-size="14">8</text>
  </g>
  <g id="button-ch9" class="rs-button">
    <rect x="164" y="312" width="56" height="38" rx="8" ry="8" />
    <text class="rs-label" x="192" y="337" text-anchor="middle" font-size="14">9</text>
  </g>
</svg>
