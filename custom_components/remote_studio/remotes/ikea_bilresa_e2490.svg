<?xml version="1.0" encoding="UTF-8"?>
<!--
  IKEA BILRESA scroll wheel.
  Vertical pill with a single wheel-button on the upper portion and three
  small channel indicator dots near the bottom — matches the IKEA product
  photo. Slight 3D side-light treatment hints at the wheel's depth.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 240 380"
     role="img"
     aria-label="IKEA BILRESA scroll wheel">
  <defs>
    <linearGradient id="rs-body-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#fdfdfb"/>
      <stop offset="55%" stop-color="#f4f1ec"/>
      <stop offset="100%" stop-color="#d6d1c6"/>
    </linearGradient>
    <radialGradient id="rs-wheel-grad" cx="0.42" cy="0.38" r="0.7">
      <stop offset="0%"  stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#f4f1ec"/>
      <stop offset="100%" stop-color="#d6d1c6"/>
    </radialGradient>
    <filter id="rs-wheel-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
  </defs>

  <style>
    .rs-button { cursor: pointer; transition: filter 120ms ease-in-out; }
    .rs-button:hover { filter: brightness(0.96); }
    .rs-button.is-active circle.dot {
      fill: var(--rs-btn-active-fill, #5b8def);
      stroke: var(--rs-btn-active-stroke, #2d5fc7);
      stroke-width: 1.5;
    }
    .rs-button.is-pulsing circle.dot {
      fill: var(--rs-btn-pulse-fill, #ffd66e);
      transition: fill 80ms ease-out;
    }
    .rs-wheel { transform-origin: 120px 145px; transition: transform 280ms ease-out; }
    .rs-wheel.is-pulsing { animation: rs-wheel-pulse 480ms ease-out 1; }
    @keyframes rs-wheel-pulse {
      0%   { transform: scale(1); filter: brightness(1); }
      30%  { transform: scale(1.04); filter: brightness(1.06); }
      100% { transform: scale(1); filter: brightness(1); }
    }
    .rs-label { fill: var(--rs-label-fill, #38322a); font-family: system-ui, sans-serif; font-weight: 600; pointer-events: none; }
  </style>

  <!-- Body: vertical pill with subtle side-light gradient for depth. -->
  <rect x="20" y="20" width="200" height="340" rx="100" ry="100"
        fill="url(#rs-body-grad)" stroke="#cfc8bc" stroke-width="1.5" />

  <!-- Wheel: large circle inset on the upper portion, drawn with a
       radial gradient so it reads as a slightly-raised disc. -->
  <g class="rs-wheel" id="wheel">
    <!-- Soft drop-shadow under the wheel -->
    <ellipse cx="120" cy="232" rx="84" ry="6" fill="rgba(0,0,0,0.12)"
             filter="url(#rs-wheel-shadow)" pointer-events="none"/>
    <circle cx="120" cy="145" r="92" fill="url(#rs-wheel-grad)"
            stroke="#cfc8bc" stroke-width="1.2"/>
  </g>

  <!-- Three indicator dots near the bottom — clickable hotspots with a
       larger transparent hit area so they're easy to tap. -->
  <g id="button-dot1" class="rs-button">
    <circle cx="98" cy="305" r="22" fill="transparent" />
    <circle class="dot" cx="98" cy="305" r="6"
            fill="#bdb5a4" stroke="#a59c89" stroke-width="0.8" />
  </g>
  <g id="button-dot2" class="rs-button">
    <circle cx="120" cy="305" r="22" fill="transparent" />
    <circle class="dot" cx="120" cy="305" r="6"
            fill="#bdb5a4" stroke="#a59c89" stroke-width="0.8" />
  </g>
  <g id="button-dot3" class="rs-button">
    <circle cx="142" cy="305" r="22" fill="transparent" />
    <circle class="dot" cx="142" cy="305" r="6"
            fill="#bdb5a4" stroke="#a59c89" stroke-width="0.8" />
  </g>
</svg>
