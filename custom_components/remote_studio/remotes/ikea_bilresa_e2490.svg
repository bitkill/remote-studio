<?xml version="1.0" encoding="UTF-8"?>
<!--
  IKEA BILRESA scroll wheel — three-dot variant.
  Body is rotated 8° clockwise to give the on-screen remote a tilted,
  hand-held feel matching the user's preference.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 360 280"
     role="img"
     aria-label="IKEA BILRESA scroll wheel">
  <style>
    .rs-body { fill: var(--rs-body-fill, #f4f1ec); stroke: var(--rs-body-stroke, #cfc8bc); stroke-width: 2; }
    .rs-shadow { fill: rgba(0,0,0,0.08); }
    .rs-button { cursor: pointer; transition: filter 120ms ease-in-out; }
    .rs-button .ring {
      fill: none;
      stroke: var(--rs-btn-stroke, #b8b0a0);
      stroke-width: 1.4;
      stroke-dasharray: 2 5;
      pointer-events: none;
    }
    .rs-button circle.btn-shape {
      fill: var(--rs-btn-fill, #ffffff);
      stroke: var(--rs-btn-stroke, #c8c2b6);
      stroke-width: 1.5;
    }
    .rs-button:hover { filter: brightness(0.96); }
    .rs-button.is-active circle.btn-shape {
      fill: var(--rs-btn-active-fill, #d8e8ff);
      stroke: var(--rs-btn-active-stroke, #5b8def);
    }
    .rs-button.is-pulsing circle.btn-shape {
      fill: var(--rs-btn-pulse-fill, #ffd66e);
      transition: fill 80ms ease-out;
    }
    .rs-label { fill: var(--rs-label-fill, #38322a); font-family: system-ui, -apple-system, sans-serif; font-weight: 600; pointer-events: none; }
    .rs-brand { fill: var(--rs-label-fill, #38322a); opacity: 0.45; font-family: system-ui, sans-serif; font-size: 10px; letter-spacing: 0.2em; pointer-events: none; }
  </style>

  <!-- Tilted body group -->
  <g transform="rotate(8 180 140)">
    <!-- Soft drop-shadow under the body -->
    <ellipse class="rs-shadow" cx="180" cy="232" rx="135" ry="9" />

    <!-- Body: horizontal pill -->
    <rect class="rs-body" x="40" y="60" width="280" height="160" rx="80" ry="80" />

    <!-- Brand mark (just a subtle wordmark) -->
    <text class="rs-brand" x="180" y="92" text-anchor="middle">BILRESA</text>

    <!-- Dot 1 -->
    <g id="button-dot1" class="rs-button">
      <circle class="ring" cx="100" cy="140" r="48" />
      <circle class="btn-shape" cx="100" cy="140" r="36" />
      <text class="rs-label" x="100" y="148" text-anchor="middle" font-size="22">1</text>
    </g>

    <!-- Dot 2 (centre) -->
    <g id="button-dot2" class="rs-button">
      <circle class="ring" cx="180" cy="140" r="48" />
      <circle class="btn-shape" cx="180" cy="140" r="36" />
      <text class="rs-label" x="180" y="148" text-anchor="middle" font-size="22">2</text>
    </g>

    <!-- Dot 3 -->
    <g id="button-dot3" class="rs-button">
      <circle class="ring" cx="260" cy="140" r="48" />
      <circle class="btn-shape" cx="260" cy="140" r="36" />
      <text class="rs-label" x="260" y="148" text-anchor="middle" font-size="22">3</text>
    </g>
  </g>
</svg>
