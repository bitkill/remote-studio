id: ikea_bilresa_e2490
name: IKEA BILRESA (scroll wheel)
manufacturers:
  - IKEA
  - IKEA of Sweden
  - Inter IKEA Systems
models:
  - E2490
  - BILRESA scroll wheel
battery:
  count: 2
  type: AAA
svg: ikea_bilresa_e2490.svg

# Physically the BILRESA scroll wheel is one wheel-button + three small
# channel indicators. Matter exposes 9 GenericSwitch endpoints that
# group as 3 "dots" × 3 slots:
#
#   Dot 1 → endpoint 1 (CW tick) · 2 (CCW tick) · 3 (press, with hold)
#   Dot 2 → endpoint 4 (CW tick) · 5 (CCW tick) · 6 (press, with hold)
#   Dot 3 → endpoint 7 (CW tick) · 8 (CCW tick) · 9 (press, with hold)
#
# Each dot is its own group, so the user can wire a different target
# per dot.
#
# Latency note: HA debounces matter event entities by ~400-1200 ms,
# so listening to them makes rotation feel sluggish. We listen to the
# device's `current_switch_position` sensors instead, which flip
# 0 → 1 → 0 on physical actuation with ~20-40 ms latency.
#
#   ⚠ The position sensors are DISABLED by default in HA. Open the
#   BILRESA device page in HA, click "+N disabled entities" and
#   enable every "Current switch position" sensor before this layout
#   responds to rotation / press. Matter event entities still feed
#   the long-press path (no positional analogue for hold timing).

buttons:
  - id: dot1
    label: "Dot 1"
    group: dot1
    states:
      - id: rotate_cw
        label: "Rotate clockwise"
        role: dim_up
        sources:
          matter_position: { endpoint: 1, edge: rising }
      - id: rotate_ccw
        label: "Rotate counter-clockwise"
        role: dim_down
        sources:
          matter_position: { endpoint: 2, edge: rising }
      - id: press
        label: "Press"
        role: toggle
        sources:
          matter_position: { endpoint: 3, edge: rising }
      - id: hold
        label: "Long press"
        sources:
          matter: { endpoint: 3, event: "long_press" }

  - id: dot2
    label: "Dot 2"
    group: dot2
    states:
      - id: rotate_cw
        label: "Rotate clockwise"
        role: dim_up
        sources:
          matter_position: { endpoint: 4, edge: rising }
      - id: rotate_ccw
        label: "Rotate counter-clockwise"
        role: dim_down
        sources:
          matter_position: { endpoint: 5, edge: rising }
      - id: press
        label: "Press"
        role: toggle
        sources:
          matter_position: { endpoint: 6, edge: rising }
      - id: hold
        label: "Long press"
        sources:
          matter: { endpoint: 6, event: "long_press" }

  - id: dot3
    label: "Dot 3"
    group: dot3
    states:
      - id: rotate_cw
        label: "Rotate clockwise"
        role: dim_up
        sources:
          matter_position: { endpoint: 7, edge: rising }
      - id: rotate_ccw
        label: "Rotate counter-clockwise"
        role: dim_down
        sources:
          matter_position: { endpoint: 8, edge: rising }
      - id: press
        label: "Press"
        role: toggle
        sources:
          matter_position: { endpoint: 9, edge: rising }
      - id: hold
        label: "Long press"
        sources:
          matter: { endpoint: 9, event: "long_press" }
