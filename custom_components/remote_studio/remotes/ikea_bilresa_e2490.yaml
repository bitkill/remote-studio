id: ikea_bilresa_e2490
name: IKEA BILRESA (scroll wheel)
manufacturers:
  - IKEA
  - IKEA of Sweden
  - Inter IKEA Systems
models:
  - E2490
  - BILRESA scroll wheel
svg: ikea_bilresa_e2490.svg

# Although Matter exposes 9 GenericSwitch endpoints on the BILRESA, they
# group as 3 physical "dots" × 3 slots:
#
#   Dot 1 → endpoint 1 (CW tick) · endpoint 2 (CCW tick) · endpoint 3 (press)
#   Dot 2 → endpoint 4 (CW tick) · endpoint 5 (CCW tick) · endpoint 6 (press)
#   Dot 3 → endpoint 7 (CW tick) · endpoint 8 (CCW tick) · endpoint 9 (press)
#
# We surface the 3 dots only — each as a button with rotate / press
# gestures — so users see a layout that matches the physical remote.
# Source: bilresa_three_light_dimmer_v2.yaml blueprint.

buttons:
  - id: dot1
    label: "Dot 1"
    states:
      - id: rotate_cw
        label: "Rotate clockwise"
        sources:
          matter: { endpoint: 1, event: "multi_press_1" }
      - id: rotate_ccw
        label: "Rotate counter-clockwise"
        sources:
          matter: { endpoint: 2, event: "multi_press_1" }
      - id: press
        label: "Press"
        sources:
          matter: { endpoint: 3, event: "multi_press_1" }
      - id: double
        label: "Double press"
        sources:
          matter: { endpoint: 3, event: "multi_press_2" }
      - id: triple
        label: "Triple press"
        sources:
          matter: { endpoint: 3, event: "multi_press_3" }
      - id: hold
        label: "Hold"
        sources:
          matter: { endpoint: 3, event: "long_press" }
      - id: release
        label: "Release"
        sources:
          matter: { endpoint: 3, event: "long_release" }

  - id: dot2
    label: "Dot 2"
    states:
      - id: rotate_cw
        label: "Rotate clockwise"
        sources:
          matter: { endpoint: 4, event: "multi_press_1" }
      - id: rotate_ccw
        label: "Rotate counter-clockwise"
        sources:
          matter: { endpoint: 5, event: "multi_press_1" }
      - id: press
        label: "Press"
        sources:
          matter: { endpoint: 6, event: "multi_press_1" }
      - id: double
        label: "Double press"
        sources:
          matter: { endpoint: 6, event: "multi_press_2" }
      - id: triple
        label: "Triple press"
        sources:
          matter: { endpoint: 6, event: "multi_press_3" }
      - id: hold
        label: "Hold"
        sources:
          matter: { endpoint: 6, event: "long_press" }
      - id: release
        label: "Release"
        sources:
          matter: { endpoint: 6, event: "long_release" }

  - id: dot3
    label: "Dot 3"
    states:
      - id: rotate_cw
        label: "Rotate clockwise"
        sources:
          matter: { endpoint: 7, event: "multi_press_1" }
      - id: rotate_ccw
        label: "Rotate counter-clockwise"
        sources:
          matter: { endpoint: 8, event: "multi_press_1" }
      - id: press
        label: "Press"
        sources:
          matter: { endpoint: 9, event: "multi_press_1" }
      - id: double
        label: "Double press"
        sources:
          matter: { endpoint: 9, event: "multi_press_2" }
      - id: triple
        label: "Triple press"
        sources:
          matter: { endpoint: 9, event: "multi_press_3" }
      - id: hold
        label: "Hold"
        sources:
          matter: { endpoint: 9, event: "long_press" }
      - id: release
        label: "Release"
        sources:
          matter: { endpoint: 9, event: "long_release" }
