id: ikea_bilresa_e2490
name: IKEA BILRESA (scroll wheel)
manufacturers:
  - IKEA
  - IKEA of Sweden
  - Inter IKEA Systems
models:
  - E2490
  - BILRESA scroll wheel
svg: ikea_bilresa_e2490.svg

# Physically the BILRESA scroll wheel is one wheel-button + three small
# channel indicators. Matter exposes 9 GenericSwitch endpoints that
# group as 3 "dots" × 3 slots:
#
#   Dot 1 → endpoint 1 (CW tick) · 2 (CCW tick) · 3 (press, with hold)
#   Dot 2 → endpoint 4 (CW tick) · 5 (CCW tick) · 6 (press, with hold)
#   Dot 3 → endpoint 7 (CW tick) · 8 (CCW tick) · 9 (press, with hold)
#
# Source: bilresa_three_light_dimmer_v2.yaml blueprint.
#
# We surface 4 states per dot — rotate_cw / rotate_ccw / press / hold —
# matching the four actions a user actually wires up in practice.
# (multi_press_2/3 and long_release are dropped to keep the editor tidy.)

buttons:
  - id: dot1
    label: "Dot 1"
    states:
      - id: rotate_cw
        label: "Rotate clockwise"
        sources:
          matter: { endpoint: 1, event: "multi_press_1" }
      - id: rotate_ccw
        label: "Rotate counter-clockwise"
        sources:
          matter: { endpoint: 2, event: "multi_press_1" }
      - id: press
        label: "Press"
        sources:
          matter: { endpoint: 3, event: "multi_press_1" }
      - id: hold
        label: "Long press"
        sources:
          matter: { endpoint: 3, event: "long_press" }

  - id: dot2
    label: "Dot 2"
    states:
      - id: rotate_cw
        label: "Rotate clockwise"
        sources:
          matter: { endpoint: 4, event: "multi_press_1" }
      - id: rotate_ccw
        label: "Rotate counter-clockwise"
        sources:
          matter: { endpoint: 5, event: "multi_press_1" }
      - id: press
        label: "Press"
        sources:
          matter: { endpoint: 6, event: "multi_press_1" }
      - id: hold
        label: "Long press"
        sources:
          matter: { endpoint: 6, event: "long_press" }

  - id: dot3
    label: "Dot 3"
    states:
      - id: rotate_cw
        label: "Rotate clockwise"
        sources:
          matter: { endpoint: 7, event: "multi_press_1" }
      - id: rotate_ccw
        label: "Rotate counter-clockwise"
        sources:
          matter: { endpoint: 8, event: "multi_press_1" }
      - id: press
        label: "Press"
        sources:
          matter: { endpoint: 9, event: "multi_press_1" }
      - id: hold
        label: "Long press"
        sources:
          matter: { endpoint: 9, event: "long_press" }
