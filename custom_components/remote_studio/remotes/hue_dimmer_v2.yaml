id: hue_dimmer_v2
name: Philips Hue Dimmer (v2)
manufacturer: Signify Netherlands B.V.
models:
  - RWL022
battery:
  count: 1
  type: CR2032
svg: hue_dimmer_v2.svg

# v2 dimmer (RWL022): same Hue manufacturer-specific cluster as v1, with
# the bottom "hue" wordmark button mapping to the off_* events.
#
# ZHA's Hue quirk normalises the cluster into zha_event commands of the
# form `<button>_<press_type>` (button ∈ on/up/down/off, press_type ∈
# press/short_release/hold/long_release). Z2M emits the same shape with
# `press_release` / `hold_release` instead of `short_release` /
# `long_release`.
buttons:
  - id: power
    label: "Power"
    states:
      - id: press
        label: "Press"
        role: turn_on
        sources:
          zha: { command: "on_press" }
          z2m: { action: "on_press" }
      - id: hold
        label: "Hold"
        sources:
          zha: { command: "on_hold" }
          z2m: { action: "on_hold" }

  - id: bright_up
    label: "Brighter"
    states:
      - id: press
        role: dim_up
        sources:
          zha: { command: "up_press" }
          z2m: { action: "up_press" }
      - id: hold
        role: dim_up
        sources:
          zha: { command: "up_hold" }
          z2m: { action: "up_hold" }

  - id: bright_down
    label: "Dimmer"
    states:
      - id: press
        role: dim_down
        sources:
          zha: { command: "down_press" }
          z2m: { action: "down_press" }
      - id: hold
        role: dim_down
        sources:
          zha: { command: "down_hold" }
          z2m: { action: "down_hold" }

  - id: hue
    label: "Hue"
    states:
      - id: press
        role: turn_off
        sources:
          zha: { command: "off_press" }
          z2m: { action: "off_press" }
      - id: hold
        sources:
          zha: { command: "off_hold" }
          z2m: { action: "off_hold" }
