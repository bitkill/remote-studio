<?xml version="1.0" encoding="UTF-8"?>
<!--
  Philips Hue Dimmer v2 (RWL022) — front-on trace from the product
  photo. Tall rounded rectangle divided into three visible sections:
    Top:    power button (⏻)
    Middle: a single rocker strip with brightness-up and brightness-down
            zones (sun-with-rays / smaller sun icons)
    Bottom: "hue" wordmark button
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 200 500"
     role="img"
     aria-label="Philips Hue Dimmer v2 remote">
  <style>
    .rs-button { cursor: pointer; transition: filter 120ms ease-in-out; }
    .rs-button:hover rect.btn-shape { fill: #ebe6dc; }
    .rs-button.is-active rect.btn-shape {
      fill: var(--rs-btn-active-fill, #d8e8ff);
    }
    .rs-button.is-pulsing rect.btn-shape {
      fill: var(--rs-btn-pulse-fill, #ffd66e);
      transition: fill 80ms ease-out;
    }
    .icon { fill: none; stroke: #6e6859; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
    .icon-fill { fill: #6e6859; pointer-events: none; }
    .wordmark { fill: #6e6859; font-family: system-ui, sans-serif; font-weight: 300; font-size: 28px; pointer-events: none; }
  </style>

  <!-- Body silhouette: rounded rectangle, soft white. -->
  <rect x="20" y="20" width="160" height="440" rx="22" ry="22"
        fill="#fafaf6" stroke="#7a7363" stroke-width="1.4" />

  <!-- ======== TOP: Power button ======== -->
  <g id="button-power" class="rs-button">
    <rect class="btn-shape" x="20" y="20" width="160" height="115"
          rx="22" ry="22" fill="transparent" />
    <!-- Power icon: 3/4 circle open at the top + vertical bar -->
    <path class="icon"
          d="M 90 70
             A 14 14 0 1 0 110 70" />
    <line class="icon" x1="100" y1="55" x2="100" y2="73" />
    <!-- Tiny LED status mark -->
    <line class="icon" x1="92" y1="118" x2="108" y2="118" />
  </g>

  <!-- Visible seam between the top and middle sections -->
  <line x1="20" y1="135" x2="180" y2="135"
        stroke="#cfc8bc" stroke-width="1" />

  <!-- ======== MIDDLE: Brightness rocker (two zones) ======== -->
  <!-- Brightness up — sun with longer rays -->
  <g id="button-bright_up" class="rs-button">
    <rect class="btn-shape" x="20" y="135" width="160" height="105"
          fill="transparent" />
    <g transform="translate(100, 188)">
      <circle class="icon" r="9" />
      <line class="icon" x1="0"   y1="-15" x2="0"   y2="-21" />
      <line class="icon" x1="15"  y1="0"   x2="21"  y2="0" />
      <line class="icon" x1="0"   y1="15"  x2="0"   y2="21" />
      <line class="icon" x1="-15" y1="0"   x2="-21" y2="0" />
      <line class="icon" x1="11"  y1="-11" x2="15"  y2="-15" />
      <line class="icon" x1="11"  y1="11"  x2="15"  y2="15" />
      <line class="icon" x1="-11" y1="11"  x2="-15" y2="15" />
      <line class="icon" x1="-11" y1="-11" x2="-15" y2="-15" />
    </g>
  </g>

  <!-- Brightness down — smaller sun, shorter rays -->
  <g id="button-bright_down" class="rs-button">
    <rect class="btn-shape" x="20" y="240" width="160" height="105"
          fill="transparent" />
    <g transform="translate(100, 292)">
      <circle class="icon" r="6" />
      <line class="icon" x1="0"   y1="-10" x2="0"   y2="-14" />
      <line class="icon" x1="10"  y1="0"   x2="14"  y2="0" />
      <line class="icon" x1="0"   y1="10"  x2="0"   y2="14" />
      <line class="icon" x1="-10" y1="0"   x2="-14" y2="0" />
      <line class="icon" x1="7"   y1="-7"  x2="10"  y2="-10" />
      <line class="icon" x1="7"   y1="7"   x2="10"  y2="10" />
      <line class="icon" x1="-7"  y1="7"   x2="-10" y2="10" />
      <line class="icon" x1="-7"  y1="-7"  x2="-10" y2="-10" />
    </g>
  </g>

  <!-- Visible seam between middle and bottom -->
  <line x1="20" y1="345" x2="180" y2="345"
        stroke="#cfc8bc" stroke-width="1" />

  <!-- ======== BOTTOM: Hue wordmark button ======== -->
  <g id="button-hue" class="rs-button">
    <rect class="btn-shape" x="20" y="345" width="160" height="115"
          rx="22" ry="22" fill="transparent" />
    <text class="wordmark" x="100" y="412" text-anchor="middle">hue</text>
  </g>
</svg>
