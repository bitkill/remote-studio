<?xml version="1.0" encoding="UTF-8"?>
<!--
  IKEA TRÅDFRI Shortcut button (E1812) — single-button puck.
  Round/oval body with one large central button.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 200 220"
     role="img"
     aria-label="IKEA TRÅDFRI Shortcut button">
  <style>
    .rs-button { cursor: pointer; transition: filter 120ms ease-in-out; }
    .rs-button:hover circle.btn-shape { fill: #ebe6dc; }
    .rs-button.is-active circle.btn-shape {
      fill: var(--rs-btn-active-fill, #d8e8ff);
      stroke: var(--rs-btn-active-stroke, #5b8def);
    }
    .rs-button.is-pulsing circle.btn-shape {
      fill: var(--rs-btn-pulse-fill, #ffd66e);
      transition: fill 80ms ease-out;
    }
  </style>

  <!-- Body silhouette: rounded rectangle, slightly taller than wide. -->
  <rect x="20" y="20" width="160" height="180" rx="32" ry="32"
        fill="#fafaf6" stroke="#7a7363" stroke-width="1.4" />

  <!-- Single central button -->
  <g id="button-button" class="rs-button">
    <circle cx="100" cy="110" r="56" fill="transparent" />
    <!-- Recess seam halo -->
    <circle cx="100" cy="110" r="50" fill="none"
            stroke="#a39a85" stroke-width="0.9" />
    <!-- Button face -->
    <circle class="btn-shape" cx="100" cy="110" r="46"
            fill="#f7f3e9" stroke="#7a7363" stroke-width="1.2" />
  </g>
</svg>
