id: hue_dimmer_v1
name: Philips Hue Dimmer (v1)
manufacturers:
  - Philips
  - Signify Netherlands B.V.
models:
  - RWL021
battery:
  count: 1
  type: CR2450
svg: hue_dimmer_v1.svg

# Hue Dimmer v1 (RWL021) has four discrete buttons separated by visible
# seams (vs the v2 which uses a hue-wordmark fourth button). Z2M action
# strings are the same family as v2; ZHA support requires the Philips
# manufacturer-specific cluster and is skipped for now.
buttons:
  - id: power
    label: "On"
    states:
      - id: press
        label: "Press"
        sources:
          z2m: { action: "on_press" }
      - id: hold
        label: "Hold"
        sources:
          z2m: { action: "on_hold" }
      - id: release
        label: "Release"
        sources:
          z2m: { action: "on_press_release" }

  - id: bright_up
    label: "Brighter"
    states:
      - id: press
        sources:
          z2m: { action: "up_press" }
      - id: hold
        sources:
          z2m: { action: "up_hold" }
      - id: release
        sources:
          z2m: { action: "up_press_release" }

  - id: bright_down
    label: "Dimmer"
    states:
      - id: press
        sources:
          z2m: { action: "down_press" }
      - id: hold
        sources:
          z2m: { action: "down_hold" }
      - id: release
        sources:
          z2m: { action: "down_press_release" }

  - id: "off"
    label: "Off"
    states:
      - id: press
        label: "Press"
        sources:
          z2m: { action: "off_press" }
      - id: hold
        label: "Hold"
        sources:
          z2m: { action: "off_hold" }
      - id: release
        label: "Release"
        sources:
          z2m: { action: "off_press_release" }
