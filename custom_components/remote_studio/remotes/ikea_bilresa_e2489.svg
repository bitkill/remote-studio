<?xml version="1.0" encoding="UTF-8"?>
<!--
  IKEA BILRESA 2-button (E2489) — traced from the IKEA manual front
  view. Vertical pill body with two round button-discs stacked
  vertically. Each button reads as a separate piece thanks to its
  recess-seam halo.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 200 320"
     role="img"
     aria-label="IKEA BILRESA 2-button remote">
  <style>
    .rs-button { cursor: pointer; transition: filter 120ms ease-in-out; }
    .rs-button:hover circle.btn-shape { fill: #ebe4d2; }
    .rs-button.is-active circle.btn-shape {
      fill: var(--rs-btn-active-fill, #d8e8ff);
      stroke: var(--rs-btn-active-stroke, #5b8def);
    }
    .rs-button.is-pulsing circle.btn-shape {
      fill: var(--rs-btn-pulse-fill, #ffd66e);
      transition: fill 80ms ease-out;
    }
  </style>

  <!-- Body silhouette: vertical pill, fully rounded ends. -->
  <path d="M 20 100
           A 80 80 0 0 1 180 100
           L 180 220
           A 80 80 0 0 1 20 220
           Z"
        fill="#efeadd"
        stroke="#7a7363"
        stroke-width="1.4"
        stroke-linejoin="round" />

  <!--
    Inner pill outline — the top-face perimeter where the front face
    curves around to the side wall. Matches the IKEA manual rendering.
  -->
  <path d="M 24 100
           A 76 76 0 0 1 176 100
           L 176 220
           A 76 76 0 0 1 24 220
           Z"
        fill="none"
        stroke="#a39a85"
        stroke-width="0.9"
        stroke-linejoin="round" />

  <!-- Status indicator dot, centered between the two buttons. -->
  <circle cx="100" cy="160" r="1.8" fill="#b8b1a0" />

  <!-- Top button (the "I" / on button) -->
  <g id="button-top" class="rs-button">
    <!-- Recess seam halo -->
    <circle cx="100" cy="92" r="34"
            fill="none" stroke="#a39a85" stroke-width="0.9" />
    <!-- Button face -->
    <circle class="btn-shape" cx="100" cy="92" r="30"
            fill="#f7f3e9" stroke="#7a7363" stroke-width="1.2" />
  </g>

  <!-- Bottom button (the "O" / off button) — smaller than the top -->
  <g id="button-bottom" class="rs-button">
    <circle cx="100" cy="228" r="28"
            fill="none" stroke="#a39a85" stroke-width="0.9" />
    <circle class="btn-shape" cx="100" cy="228" r="24"
            fill="#f7f3e9" stroke="#7a7363" stroke-width="1.2" />
  </g>
</svg>
