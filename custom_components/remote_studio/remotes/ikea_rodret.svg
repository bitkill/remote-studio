<?xml version="1.0" encoding="UTF-8"?>
<!--
  IKEA RODRET wireless dimmer (E2201) — front-on trace from the
  product photo. Vertical rounded rectangle with two small buttons:
  "I" (on) near the top and "O" (off) near the bottom.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 200 320"
     role="img"
     aria-label="IKEA RODRET wireless dimmer">
  <style>
    .rs-button { cursor: pointer; transition: filter 120ms ease-in-out; }
    .rs-button:hover circle.btn-shape { fill: #ebe6dc; }
    .rs-button.is-active circle.btn-shape {
      fill: var(--rs-btn-active-fill, #d8e8ff);
      stroke: var(--rs-btn-active-stroke, #5b8def);
    }
    .rs-button.is-pulsing circle.btn-shape {
      fill: var(--rs-btn-pulse-fill, #ffd66e);
      transition: fill 80ms ease-out;
    }
    .glyph { fill: none; stroke: #6e6859; stroke-width: 2; stroke-linecap: round; pointer-events: none; }
  </style>

  <!--
    Body silhouette: rounded rectangle with gently bowed sides — the
    sides aren't perfectly straight in the product photo, they curve
    out slightly toward the middle.
  -->
  <path d="M 70 20
           L 130 20
           A 50 50 0 0 1 180 70
           Q 186 160 180 250
           A 50 50 0 0 1 130 300
           L 70 300
           A 50 50 0 0 1 20 250
           Q 14 160 20 70
           A 50 50 0 0 1 70 20
           Z"
        fill="#fafaf6"
        stroke="#7a7363"
        stroke-width="1.4"
        stroke-linejoin="round" />

  <!-- ON button (I) — small circular indent with a short vertical
       line glyph inside. -->
  <g id="button-on" class="rs-button">
    <circle cx="100" cy="78" r="20" fill="transparent" />
    <circle class="btn-shape" cx="100" cy="78" r="15"
            fill="#f4efe3" stroke="#a39a85" stroke-width="1" />
    <line class="glyph" x1="100" y1="71" x2="100" y2="85" />
  </g>

  <!-- OFF button (O) — small circular outline. -->
  <g id="button-off" class="rs-button">
    <circle cx="100" cy="252" r="20" fill="transparent" />
    <circle class="btn-shape" cx="100" cy="252" r="15"
            fill="#fafaf6" stroke="#a39a85" stroke-width="1.4" />
  </g>
</svg>
