id: ikea_rodret
name: IKEA RODRET wireless dimmer
manufacturers:
  - IKEA
  - IKEA of Sweden
models:
  - E2201
  - RODRET wireless dimmer
battery:
  count: 1
  type: CR2032
svg: ikea_rodret.svg

# Two-button on/off remote with brightness ramping on long-press.
#
# ZHA emits distinct stop commands per button (stop_with_on_off vs stop)
# so the release state works correctly for ZHA users. Zigbee2MQTT, on the
# other hand, emits a shared 'brightness_stop' action for both buttons —
# the matcher can't tell them apart, so the Z2M side only wires press
# and hold.

buttons:
  - id: "on"
    label: "On (I)"
    states:
      - id: press
        label: "Press"
        role: turn_on
        sources:
          zha: { command: "on" }
          z2m: { action: "on" }
      - id: hold
        label: "Hold"
        role: dim_up
        sources:
          zha: { command: "move_with_on_off" }
          z2m: { action: "brightness_move_up" }

  - id: "off"
    label: "Off (O)"
    states:
      - id: press
        label: "Press"
        role: turn_off
        sources:
          zha: { command: "off" }
          z2m: { action: "off" }
      - id: hold
        label: "Hold"
        role: dim_down
        sources:
          zha: { command: "move" }
          z2m: { action: "brightness_move_down" }
