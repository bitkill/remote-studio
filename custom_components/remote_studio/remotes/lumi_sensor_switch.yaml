id: lumi_sensor_switch
name: Aqara Wireless Switch (WXKG01LM)
manufacturers:
  - LUMI
  - Aqara
  - Xiaomi
models:
  - lumi.sensor_switch
  - WXKG01LM
battery:
  count: 1
  type: CR2032
svg: lumi_sensor_switch.svg

# Older Aqara wireless switch — single physical button, multi-press
# pattern. Z2M and ZHA both expose single/double/triple/hold/release
# variants.
buttons:
  - id: button
    label: "Button"
    states:
      - id: single
        label: "Single press"
        role: toggle
        sources:
          z2m: { action: "single" }
          zha: { command: "click", args: { click_type: "single" } }
      - id: double
        label: "Double press"
        sources:
          z2m: { action: "double" }
          zha: { command: "click", args: { click_type: "double" } }
      - id: triple
        label: "Triple press"
        sources:
          z2m: { action: "triple" }
          zha: { command: "click", args: { click_type: "triple" } }
      - id: hold
        label: "Hold"
        sources:
          z2m: { action: "hold" }
          zha: { command: "hold" }
