<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 240 240"
     role="img"
     aria-label="Aqara Mini Switch WXKG11LM">
  <style>
    .rs-body { fill: var(--rs-body-fill, #ffffff); stroke: var(--rs-body-stroke, #d8d4cd); stroke-width: 2; }
    .rs-button { cursor: pointer; transition: filter 120ms ease-in-out; }
    .rs-button rect, .rs-button circle, .rs-button path.btn-shape {
      fill: var(--rs-btn-fill, #fafaf7);
      stroke: var(--rs-btn-stroke, #c8c2b6);
      stroke-width: 1.5;
    }
    .rs-button:hover { filter: brightness(0.96); }
    .rs-button.is-active circle {
      fill: var(--rs-btn-active-fill, #d8e8ff);
      stroke: var(--rs-btn-active-stroke, #5b8def);
    }
    .rs-label { fill: var(--rs-label-fill, #38322a); font-family: system-ui, sans-serif; font-weight: 600; pointer-events: none; }
  </style>

  <!-- Square body with rounded corners -->
  <rect class="rs-body" x="20" y="20" width="200" height="200" rx="22" ry="22" />

  <!-- Single circular button -->
  <g id="button-button" class="rs-button">
    <circle cx="120" cy="120" r="68" />
    <text class="rs-label" x="120" y="128" text-anchor="middle" font-size="22">●</text>
  </g>
</svg>
