<?xml version="1.0" encoding="UTF-8"?>
<!--
  Aqara Wireless Switch (WXKG01LM) — older single-button puck.
  Square body with rounded corners and one large round button.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 200 200"
     role="img"
     aria-label="Aqara Wireless Switch (WXKG01LM)">
  <style>
    .rs-button { cursor: pointer; transition: filter 120ms ease-in-out; }
    .rs-button:hover circle.btn-shape { fill: #ebe6dc; }
    .rs-button.is-active circle.btn-shape {
      fill: var(--rs-btn-active-fill, #d8e8ff);
      stroke: var(--rs-btn-active-stroke, #5b8def);
    }
    .rs-button.is-pulsing circle.btn-shape {
      fill: var(--rs-btn-pulse-fill, #ffd66e);
      transition: fill 80ms ease-out;
    }
  </style>

  <!-- Body silhouette: square with rounded corners. -->
  <rect x="20" y="20" width="160" height="160" rx="22" ry="22"
        fill="#fafaf6" stroke="#7a7363" stroke-width="1.4" />

  <!-- Single circular button -->
  <g id="button-button" class="rs-button">
    <circle cx="100" cy="100" r="60" fill="transparent" />
    <!-- Recess seam halo -->
    <circle cx="100" cy="100" r="56" fill="none"
            stroke="#a39a85" stroke-width="0.9" />
    <!-- Button face -->
    <circle class="btn-shape" cx="100" cy="100" r="52"
            fill="#f7f3e9" stroke="#7a7363" stroke-width="1.2" />
  </g>
</svg>
