id: ikea_styrbar
name: IKEA STYRBAR
manufacturer: IKEA of Sweden
models:
  - Remote Control N2
battery:
  count: 1
  type: CR2032
svg: ikea_styrbar.svg

buttons:
  # Quoted because YAML 1.1 parses unquoted on/off/yes/no as booleans.
  - id: "on"
    label: "On"
    states:
      - id: press
        label: "Press"
        role: turn_on
        sources:
          zha:
            command: "on"
          z2m:
            action: "on"
      - id: hold
        label: "Hold"
        role: dim_up
        sources:
          zha:
            command: "move_with_on_off"
          z2m:
            action: "brightness_move_up"

  - id: "off"
    label: "Off"
    states:
      - id: press
        label: "Press"
        role: turn_off
        sources:
          zha:
            command: "off"
          z2m:
            action: "off"
      - id: hold
        label: "Hold"
        role: dim_down
        sources:
          zha:
            command: "move"
          z2m:
            action: "brightness_move_down"

  - id: arrow_left
    label: "Left arrow"
    states:
      - id: press
        label: "Press"
        sources:
          zha:
            command: "press"
            args:
              direction: "left"
          z2m:
            action: "arrow_left_click"
      - id: hold
        label: "Hold"
        sources:
          zha:
            command: "hold"
            args:
              direction: "left"
          z2m:
            action: "arrow_left_hold"

  - id: arrow_right
    label: "Right arrow"
    states:
      - id: press
        label: "Press"
        sources:
          zha:
            command: "press"
            args:
              direction: "right"
          z2m:
            action: "arrow_right_click"
      - id: hold
        label: "Hold"
        sources:
          zha:
            command: "hold"
            args:
              direction: "right"
          z2m:
            action: "arrow_right_hold"
