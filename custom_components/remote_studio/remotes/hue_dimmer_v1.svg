<?xml version="1.0" encoding="UTF-8"?>
<!--
  Philips Hue Dimmer v1 (RWL021) — front-on trace from the product
  photo. Tall rounded rectangle with four discrete buttons separated
  by visible seams: power on (I), brightness up, brightness down,
  power off (O).
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 200 460"
     role="img"
     aria-label="Philips Hue Dimmer v1 remote">
  <style>
    .rs-button { cursor: pointer; transition: filter 120ms ease-in-out; }
    .rs-button:hover rect.btn-shape { fill: #ebe6dc; }
    .rs-button.is-active rect.btn-shape {
      fill: var(--rs-btn-active-fill, #d8e8ff);
    }
    .rs-button.is-pulsing rect.btn-shape {
      fill: var(--rs-btn-pulse-fill, #ffd66e);
      transition: fill 80ms ease-out;
    }
    .icon { fill: none; stroke: #2a2a2a; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
  </style>

  <!-- Body silhouette: rounded rectangle, soft white. -->
  <rect x="20" y="20" width="160" height="420" rx="20" ry="20"
        fill="#fafaf6" stroke="#7a7363" stroke-width="1.4" />

  <!-- ======== TOP: power on (I) button ======== -->
  <g id="button-power" class="rs-button">
    <rect class="btn-shape" x="20" y="20" width="160" height="110"
          rx="20" ry="20" fill="transparent" />
    <line class="icon" x1="100" y1="60" x2="100" y2="90"
          stroke-width="3.2" />
  </g>

  <!-- Visible seam below ON -->
  <line x1="20" y1="130" x2="180" y2="130"
        stroke="#cfc8bc" stroke-width="1" />

  <!-- ======== Brightness up ======== -->
  <g id="button-bright_up" class="rs-button">
    <rect class="btn-shape" x="20" y="130" width="160" height="100"
          fill="transparent" />
    <g transform="translate(100, 180)">
      <circle class="icon" r="8" />
      <line class="icon" x1="0"   y1="-13" x2="0"   y2="-18" />
      <line class="icon" x1="13"  y1="0"   x2="18"  y2="0" />
      <line class="icon" x1="0"   y1="13"  x2="0"   y2="18" />
      <line class="icon" x1="-13" y1="0"   x2="-18" y2="0" />
      <line class="icon" x1="9"   y1="-9"  x2="13"  y2="-13" />
      <line class="icon" x1="9"   y1="9"   x2="13"  y2="13" />
      <line class="icon" x1="-9"  y1="9"   x2="-13" y2="13" />
      <line class="icon" x1="-9"  y1="-9"  x2="-13" y2="-13" />
    </g>
  </g>

  <!-- Visible seam between bright up and bright down -->
  <line x1="20" y1="230" x2="180" y2="230"
        stroke="#cfc8bc" stroke-width="1" />

  <!-- ======== Brightness down ======== -->
  <g id="button-bright_down" class="rs-button">
    <rect class="btn-shape" x="20" y="230" width="160" height="100"
          fill="transparent" />
    <g transform="translate(100, 280)">
      <circle class="icon" r="6" />
      <line class="icon" x1="0"   y1="-9"  x2="0"   y2="-11" />
      <line class="icon" x1="9"   y1="0"   x2="11"  y2="0" />
      <line class="icon" x1="0"   y1="9"   x2="0"   y2="11" />
      <line class="icon" x1="-9"  y1="0"   x2="-11" y2="0" />
      <line class="icon" x1="6.4" y1="-6.4" x2="7.8" y2="-7.8" />
      <line class="icon" x1="6.4" y1="6.4"  x2="7.8" y2="7.8" />
      <line class="icon" x1="-6.4" y1="6.4" x2="-7.8" y2="7.8" />
      <line class="icon" x1="-6.4" y1="-6.4" x2="-7.8" y2="-7.8" />
    </g>
  </g>

  <!-- Visible seam between bright down and OFF -->
  <line x1="20" y1="330" x2="180" y2="330"
        stroke="#cfc8bc" stroke-width="1" />

  <!-- ======== BOTTOM: power off (O) button ======== -->
  <g id="button-off" class="rs-button">
    <rect class="btn-shape" x="20" y="330" width="160" height="110"
          rx="20" ry="20" fill="transparent" />
    <circle class="icon" cx="100" cy="385" r="13"
            stroke-width="3.2" />
  </g>
</svg>
